name: deploy

on:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run --if-present test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.ref == 'refs/heads/main' && secrets.SERVER_IP || secrets.ORACLE_SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ github.ref == 'refs/heads/main' && secrets.SSH_PRIVATE_KEY || secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              cd /home/victor/app/frontend
              git pull origin main
              cd ..
              docker compose up -d --build --force-recreate frontend
            else
              cd /home/victor/dev-app/frontend
              git pull origin dev
              cd ..
              docker compose up -d --build --force-recreate frontend
            fi